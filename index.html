function Ring({val,size=80,color,sub,glow=false}){
  const r=size/2-8,circ=2*Math.PI*r;
  const fill=Math.min(val/100,1)*circ*0.75,off=circ*0.125;
  return (
    <div style={{position:"relative",width:size,height:size,filter:glow?`drop-shadow(0 0 8px ${color})`:"none"}}>
      <svg width={size} height={size} style={{transform:"rotate(-135deg)"}}>

        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={7}

          style={{transition:"stroke-dasharray 0.8s"}}/>

        {sub&&<div style={{fontSize:9,color:C.gray,marginTop:2}}>{sub}</div>}
      </div>
    </div>
  );
}

function loadEx(idx){

function completeEx(){

function updateAcc(v){

function calcReba(lm){
  if(!lm||lm.length<33)return null;
  const nose=lm[0],ls=lm[11],rs=lm[12],lh=lm[23],rh=lm[24];
  const nf=Math.abs(nose.x-(ls.x+rs.x)/2)*100,tf=Math.abs((ls.x+rs.x)/2-(lh.x+rh.x)/2)*100,sa=Math.abs(ls.y-rs.y)*100;
  let s=2;if(tf>10)s++;if(tf>25)s++;if(sa>5)s++;if(nf>10)s++;return Math.min(12,Math.max(1,Math.round(s)));
}
function setReba(r){
  if(!r)return;const c=r<=4?'#34D399':r<=7?'#FBBF24':'#F87171';
  document.getElementById('rebaVal').textContent=r;document.getElementById('rebaVal').style.color=c;
  document.getElementById('rebaBadge').style.display='block';
  document.getElementById('hmReba').textContent=r;document.getElementById('hmReba').style.color=c;
  document.getElementById('hmRebaBar').style.width=(r/12*100)+'%';document.getElementById('hmRebaBar').style.background=c;
}
function onPose(res){
  if(!res.poseLandmarks)return;
  const cv=document.getElementById('sk-canvas'),vid=document.getElementById('webcam');
  cv.width=vid.videoWidth;cv.height=vid.videoHeight;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  const r=calcReba(res.poseLandmarks);setReba(r);
  const sc=r?(r<=4?'#34D399':r<=7?'#FBBF24':'#F87171'):'#667eea';
  drawConnectors(ctx,res.poseLandmarks,POSE_CONNECTIONS,{color:sc,lineWidth:3});
  drawLandmarks(ctx,res.poseLandmarks,{color:'#764ba2',lineWidth:2,radius:4});
  if(G.active&&!G.paused){
    const ls=res.poseLandmarks[11],rs2=res.poseLandmarks[12],ns=res.poseLandmarks[0];
    const sw=Math.abs(ls.x-rs2.x),ba=Math.abs((ls.x+rs2.x)/2-(res.poseLandmarks[23].x+res.poseLandmarks[24].x)/2);
    let v=68;if(sw>.15&&sw<.35)v+=10;if(ba<.05)v+=10;if(ns.visibility>.8)v+=8;
    v+=Math.random()*8-4;updateAcc(Math.max(0,Math.min(100,Math.round(v))));
  }
}

                        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:2}}>
                          <span style={{color:C.lgray}}>{d.icon} {d.name}</span>
                          <span style={{color:d.col,fontWeight:"bold"}}>{Math.round(dimRisks[d.id])}</span>
                        </div>
                        <Bar val={dimRisks[d.id]} color={d.col} h={3}/>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              <div className="btn" onClick={()=>setTab("workout")} style={{background:"linear-gradient(135deg,#1a0510,#1a1030)",border:"1px solid #3a1525",borderRadius:14,padding:20,textAlign:"center",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10}}>
                <div style={{fontSize:42}}>🤸</div>
                <div style={{fontSize:16,fontWeight:800,...gRed}}>Smart Stretch</div>
                <div style={{fontSize:11,color:"#9a6070"}}>8 ท่า · MediaPipe AI · ลด OSRS ได้ทันที</div>
                <div style={{background:gBrand,color:"#000",borderRadius:20,padding:"5px 18px",fontSize:12,fontWeight:800}}>เริ่มเลย →</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <div className="btn" onClick={()=>setWater(w=>Math.min(8,w+1))} style={{background:"#05102a",border:`1px solid ${C.blue}40`,borderRadius:12,padding:"14px 18px",textAlign:"center",cursor:"pointer",flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
                  <div style={{fontSize:22}}>💧</div>
                  <div style={{fontSize:22,fontWeight:700,color:C.blue}}>{water}<span style={{fontSize:11,color:C.gray}}>/8</span></div>
                  <div style={{fontSize:10,color:C.gray}}>กดเพิ่มแก้วน้ำ</div>
                  <Bar val={(water/8)*100} color={C.blue}/>
                </div>
                <div style={{background:"#0a0520",border:`1px solid ${C.purple}40`,borderRadius:12,padding:"12px 18px",textAlign:"center",flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3}}>
                  <div style={{fontSize:20}}>👁️</div>
                  <div style={{fontSize:13,fontWeight:700,color:C.purple}}>20-20-20</div>
                  <div style={{fontSize:10,color:C.gray}}>มองไกล 20 ฟุต ทุก 20 นาที</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {tab==="emotion"&&(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{background:"linear-gradient(135deg,#1a0a2e,#0f0f1a)",border:"1px solid #c084fc33",borderRadius:14,padding:22}}>
              <div style={{display:"flex",gap:20,alignItems:"center"}}>
                <div style={{background:"#050510",borderRadius:12,padding:20,width:185,textAlign:"center",flexShrink:0}}>
                  <div style={{fontSize:50,marginBottom:8}}>{emotionIcon[emotion]}</div>
                  <div style={{fontSize:18,fontWeight:"bold",color:emotionColors[emotion]}}>{emotion}</div>
                  <div style={{fontSize:11,color:C.gray,marginTop:4}}>FACS Detection</div>
                  <div style={{fontSize:13,color:C.teal,marginTop:4,fontWeight:"bold"}}>{85+ri(0,12)}% Confidence</div>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:15,fontWeight:"bold",color:C.white,marginBottom:12}}>🧠 AI Emotion + Stress Analysis</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                    {[{l:"Stress",v:Math.round(stress)+"%",c:stress<50?C.green:C.red},{l:"Fatigue",v:Math.round(fatigue)+"%",c:fatigue<50?C.green:C.orange},{l:"HRV",v:Math.round(hrv)+"ms",c:C.blue},{l:"Wellness",v:wellness,c:wellness>65?C.green:C.orange}].map(({l,v,c})=>(
                      <div key={l} style={{background:C.surf2,borderRadius:9,padding:12,textAlign:"center"}}>
                        <div style={{fontSize:20,fontWeight:"bold",color:c}}>{v}</div>
                        <div style={{fontSize:10,color:C.gray,marginTop:3}}>{l}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{background:`${emotionColors[emotion]}12`,border:`1px solid ${emotionColors[emotion]}44`,borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                    <div style={{fontSize:11,color:emotionColors[emotion],fontWeight:"bold",marginBottom:3}}>AI แนะนำสำหรับ "{emotion}"</div>
                    <div style={{fontSize:11,color:C.lgray}}>{emotion==="Stressed"?"→ เอียงคอ + ยืดหลัง + แอ่นหลัง (ลด Cortisol 27%)":emotion==="Tired"?"→ หมุนไหล่ + ยืดแขน + บิดลำตัว":emotion==="Anxious"?"→ ยืดน่อง + ยืดข้อมือ (คลายกังวล)":"→ ท่าครบชุด 8 ท่า Office Syndrome Prevention"}</div>
                  </div>
                  <button className="btn" onClick={()=>setTab("workout")} style={{background:gBrand,color:"#000",border:"none",borderRadius:10,padding:"9px 20px",fontSize:12,fontWeight:800}}>🤸 ไปยืดเส้นตามคำแนะนำ →</button>
                </div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              <div style={{background:C.surf,border:"1px solid #2a2a45",borderRadius:14,padding:18}}>
                <div style={{fontSize:13,fontWeight:"bold",color:C.purple,marginBottom:12}}>📊 7 Health Dimensions</div>
                {DIMS.map(d=>(
                  <div key={d.id} style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                      <span style={{color:C.lgray}}>{d.icon} {d.name} <span style={{fontSize:9,opacity:.5}}>×{Math.round(d.weight*100)}%</span></span>
                      <span style={{color:dimRisks[d.id]>=65?C.red:dimRisks[d.id]>=45?C.orange:C.green,fontWeight:"bold"}}>{Math.round(dimRisks[d.id])}</span>
                    </div>
                    <Bar val={dimRisks[d.id]} color={dimRisks[d.id]>=65?C.red:dimRisks[d.id]>=45?C.orange:C.green}/>
                  </div>
                ))}
              </div>
              <div style={{background:C.surf,border:"1px solid #2a2a45",borderRadius:14,padding:18}}>
                <div style={{fontSize:13,fontWeight:"bold",color:C.teal,marginBottom:12}}>🎯 AI Recommendations</div>
                {[
                  {cond:stress>60,msg:"ความเครียดสูง → ยืดเส้น + พัก",color:C.red},
                  {cond:fatigue>60,msg:"ล้า → หมุนไหล่ + ยืดหลัง",color:C.orange},
                  {cond:sittingMin>40,msg:`นั่ง ${Math.round(sittingMin)} นาที → ลุกยืด!`,color:C.orange},
                  {cond:water<4,msg:"น้ำน้อย → เพิ่มให้ครบ 8 แก้ว",color:C.blue},
                  {cond:osrs>60,msg:`OSRS ${osrs} → ยืดเส้นลดความเสี่ยง`,color:C.osrs},
                ].filter(r=>r.cond).map((r,i)=>(
                  <div key={i} style={{display:"flex",gap:8,padding:"7px 0",borderBottom:"1px solid #1e1e3a"}}>
                    <div style={{width:6,height:6,borderRadius:"50%",background:r.color,marginTop:4,flexShrink:0}}/>
                    <span style={{fontSize:11,color:C.lgray}}>{r.msg}</span>
                  </div>
                ))}
                {stress<=60&&fatigue<=60&&sittingMin<=40&&<div style={{fontSize:12,color:C.green,textAlign:"center",padding:"14px 0"}}>✅ สุขภาพดีเยี่ยม!</div>}
              </div>
            </div>
          </div>
        )}

        {tab==="workout"&&<SmartStretchTab osrs={osrs} osrsColor={osrsColor} stress={stress} emotion={emotion}/>}

        {tab==="risk"&&(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{background:"#ffffff",borderRadius:16,padding:"24px 28px",display:"grid",gridTemplateColumns:"auto 1fr",gap:24,alignItems:"center",border:`2px solid ${osrsColor}55`}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
                <div style={{position:"relative",width:180,height:180}}>
                  <svg width={180} height={180} style={{transform:"rotate(-135deg)"}}>
                    <circle cx={90} cy={90} r={72} fill="none" stroke="#e0e0f0" strokeWidth={12} strokeDasharray={`${2*Math.PI*72*0.75} ${2*Math.PI*72}`} strokeDashoffset={-(2*Math.PI*72*0.125)} strokeLinecap="round"/>
                    <circle cx={90} cy={90} r={72} fill="none" stroke={osrsColor} strokeWidth={12} strokeDasharray={`${(osrs/100)*2*Math.PI*72*0.75} ${2*Math.PI*72}`} strokeDashoffset={-(2*Math.PI*72*0.125)} strokeLinecap="round" style={{transition:"stroke-dasharray 1s"}}/>
                  </svg>
                  <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                    <div style={{fontSize:48,fontWeight:900,color:osrsColor,lineHeight:1}}>{osrs}</div>
                    <div style={{fontSize:12,color:"#666"}}>/ 100</div>
                    <div style={{fontSize:13,fontWeight:800,color:osrsColor,marginTop:4}}>{osrsLabel} RISK</div>
                  </div>
                </div>
                <div style={{background:osrsColor,color:"#fff",borderRadius:10,padding:"8px 18px",fontSize:12,fontWeight:700}}>
                  {osrs>=70?"⚠️ ต้องดำเนินการทันที":osrs>=45?"⚡ ควรปรับพฤติกรรม":"✅ รักษาระดับนี้"}
                </div>
              </div>
              <div>
                <div style={{fontSize:18,fontWeight:800,color:"#1a1a3a",marginBottom:4}}>Office Syndrome Risk Score (OSRS)</div>
                <div style={{fontSize:12,color:"#555",marginBottom:16}}>คำนวณจาก 7 มิติ × น้ำหนัก — AI Real-time</div>
                {DIMS.map(d=>{const risk=dimRisks[d.id],rc=risk>=65?C.red:risk>=45?C.orange:C.green;return(
                  <div key={d.id} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}><span>{d.icon}</span><span style={{fontSize:13,color:"#1a1a3a",fontWeight:600}}>{d.name}</span><span style={{fontSize:10,background:"#e8e8f0",color:"#666",borderRadius:4,padding:"1px 5px"}}>×{Math.round(d.weight*100)}%</span></div>
                      <span style={{fontSize:14,fontWeight:800,color:rc}}>{Math.round(risk)}</span>
                    </div>
                    <div style={{height:8,background:"#e0e0f0",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.min(100,risk)}%`,background:rc,borderRadius:4,transition:"width .6s"}}/></div>
                  </div>
                );})}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              {[{lo:0,hi:25,l:"ปลอดภัย",c:C.green,d:"พฤติกรรมดีเยี่ยม"},{lo:26,hi:50,l:"เฝ้าระวัง",c:C.teal,d:"ปรับเล็กน้อย"},{lo:51,hi:75,l:"เสี่ยงสูง",c:C.orange,d:"ต้องแก้ไข"},{lo:76,hi:100,l:"วิกฤต",c:C.red,d:"พบแพทย์ทันที"}].map(({lo,hi,l,c,d})=>{
                const active=osrs>=lo&&osrs<=hi;
                return(<div key={lo} style={{background:active?"#fff":"#f8f8ff",border:`2px solid ${active?c:"#ddd"}`,borderRadius:12,padding:"16px 14px",textAlign:"center",borderTop:`4px solid ${c}`}}>
                  {active&&<div style={{fontSize:9,color:c,fontWeight:"bold",marginBottom:4}}>● คุณอยู่นี่</div>}
                  <div style={{fontSize:18,fontWeight:900,color:c}}>{lo}-{hi}</div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1a1a3a",marginTop:4}}>{l}</div>
                  <div style={{fontSize:11,color:"#888",marginTop:3}}>{d}</div>
                </div>);
              })}
            </div>
          </div>
        )}

        {tab==="results"&&(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              {[{l:"ท่าที่ทำวันนี้",v:totalStretch,u:"ท่า",c:C.teal},{l:"Calories",v:totalCal,u:"kcal",c:C.orange},{l:"OSRS ลดลง",v:totalStretch*4,u:"pt",c:C.osrs},{l:"Wellness",v:wellness,u:"/100",c:wellness>65?C.green:C.orange}].map((s,i)=>(
                <div key={i} style={{background:C.surf,border:`1px solid ${s.c}30`,borderRadius:12,padding:"18px",textAlign:"center",borderTop:`3px solid ${s.c}`}}>
                  <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}<span style={{fontSize:11,color:C.gray,marginLeft:2}}>{s.u}</span></div>
                  <div style={{fontSize:11,color:C.gray,marginTop:5}}>{s.l}</div>
                </div>
              ))}
            </div>
            <div style={{background:"linear-gradient(135deg,#1a0510,#1a1030)",border:"1px solid #3a1525",borderRadius:14,padding:22,textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:800,...gRed,marginBottom:8}}>FlexMind AI — Office Wellness Platform</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,maxWidth:480,margin:"0 auto 16px"}}>
                {[{v:"0",l:"แบบฟอร์มที่ต้องกรอก",c:C.green},{v:"7",l:"มิติวัดอัตโนมัติ",c:C.teal},{v:"Real-time",l:"ทุก 1.5 วินาที",c:C.purple}].map((s,i)=>(
                  <div key={i} style={{background:"rgba(255,255,255,.06)",borderRadius:10,padding:12}}>
                    <div style={{fontSize:18,fontWeight:"bold",color:s.c}}>{s.v}</div>
                    <div style={{fontSize:10,color:C.gray,marginTop:3}}>{s.l}</div>
                  </div>
                ))}
              </div>
              <button className="btn" onClick={()=>setTab("workout")} style={{background:gBrand,color:"#000",border:"none",borderRadius:12,padding:"12px 40px",fontSize:14,fontWeight:800}}>🤸 ยืดต่อเลย!</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
